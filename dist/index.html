            "@type": "Question",
            "name": "How do I know if I should refinance my home loan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Refinance if switching lenders results in significant net savings after fees. Review your rate annually or when the RBA changes cash rates."
            }
          },
          {
            "@type": "Question",
            "name": "What does it actually cost to refinance?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A standard refinance costs between $500 and $750, including bank discharge fees, lender settlement fees, and government charges."
            }
          },
          {
            "@type": "Question",
            "name": "How do I access equity, and can I use it to renovate or invest?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Lenders generally let you release usable equity up to 80% of your property's value. This can be set up as a separate loan split to fund renovations or a deposit for an investment property."
            }
          },
          {
            "@type": "Question",
            "name": "What is an offset account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An offset account is a transaction account linked to your mortgage. The balance reduces the loan principal that interest is calculated on daily, saving you money over time."
            }
          },
          {
            "@type": "Question",
            "name": "Can I have more than one offset account?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, many lenders allow multiple offset accounts, letting you split funds into different budgeting buckets while the combined balance offsets interest daily."
            }
          },
          {
            "@type": "Question",
            "name": "Can you help with self-employed home loans?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, we specialize in self-employed home loans, utilizing alternative verification paths like Alt-Doc loans, BAS statements, or accountant letters if tax returns are incomplete."
            }
          },
          {
            "@type": "Question",
            "name": "Can I buy a property with a 5% deposit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, you can. While a low deposit usually triggers Lenders Mortgage Insurance (LMI), eligible buyers can avoid this cost via government schemes like the First Home Guarantee."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between an offset account and redraw?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "An offset account is a separate transaction account, while redraw consists of extra repayments inside your loan. Offset accounts offer more flexible access and tax benefits for investors."
            }
          },
          {
            "@type": "Question",
            "name": "Do credit cards reduce borrowing capacity?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, significantly. Lenders assess borrowing power based on your total credit limit, not your outstanding balance, meaning higher limits can slash your borrowing capacity."
            }
          },

            }
